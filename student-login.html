<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JelasVerse · Student sign in</title><style>html{color-scheme:dark;font-family:"OpenDyslexic",Arial,sans-serif;background:#06131f;color:#f4ffff}body{min-height:100vh;margin:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 24%,#17526a,#081a29 48%,#020812)}main{width:min(420px,calc(100% - 40px));padding:38px;border:1px solid #80dce3a8;border-radius:18px;background:#082333e8;box-shadow:0 22px 56px #0008}p{line-height:1.7;color:#c5e1e6}label{display:grid;gap:9px;font-weight:700}input,button{font:inherit;border-radius:9px;border:1px solid #9beaf0;padding:15px}input{color:#fff;background:#061823;font-size:24px;letter-spacing:.18em;text-align:center}button{margin-top:18px;width:100%;font-weight:700;color:#06202b;background:linear-gradient(135deg,#c4f8f3,#73d5e1);cursor:pointer}#status{min-height:25px;color:#ffe5a7}</style></head><body><main><p>JELASVERSE</p><h1>Welcome</h1><p>Enter your four-digit student code.</p><form id="form"><label>Student code<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]{4}" placeholder="0000" autofocus></label><button>Enter</button></form><p id="status" role="status"></p></main><script type="module">import{signInStudent}from'./jelasverse-data.js';const form=document.querySelector('#form'),code=document.querySelector('#code'),status=document.querySelector('#status');form.addEventListener('submit',async event=>{event.preventDefault();try{status.textContent='Opening your learning space…';await signInStudent(code.value);location.assign('index.html')}catch(error){status.textContent=error.message||'Please try again.'}})</script></body></html>
